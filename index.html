<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo - João</title>
    <!-- Linkando o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="cv-container">
        <!-- Cabeçalho com Foto e Informações Pessoais -->
        <header class="cv-header">
            <!-- A foto será inserida dinamicamente aqui pelo JavaScript -->
            <div id="photoContainer"></div>
            
            <div class="header-info">
                <h1 id="fullName"></h1>
                <h2 id="professionalTitle"></h2>
                <p id="email"></p>
                <p id="phone"></p>
                <p id="location"></p>
                <p><a id="github" href="#" target="_blank"></a></p>
            </div>
        </header>

        <!-- Resumo Profissional -->
        <section class="cv-section">
            <h3>Resumo Profissional</h3>
            <p id="summaryDescription"></p>
            <p><strong>Objetivo:</strong> <span id="careerObjective"></span></p>
        </section>

        <!-- Experiência Profissional -->
        <section class="cv-section">
            <h3>Experiência Profissional</h3>
            <div id="experienceContainer"></div>
        </section>

        <!-- Educação -->
        <section class="cv-section">
            <h3>Educação</h3>
            <div id="educationContainer"></div>
        </section>

        <!-- Habilidades -->
        <section class="cv-section">
            <h3>Habilidades Técnicas</h3>
            <ul id="skillsContainer" class="skills-list"></ul>
            <p><strong>Metodologias/Ferramentas:</strong> <span id="methodologies"></span></p>
        </section>

        <!-- Projetos -->
        <section class="cv-section">
            <h3>Projetos</h3>
            <div id="projectsContainer"></div>
        </section>

        <!-- Idiomas -->
        <section class="cv-section">
            <h3>Idiomas</h3>
            <div id="languagesContainer"></div>
        </section>
    </main>

    <!-- Linkando o arquivo JavaScript (o 'defer' garante que o script rode após o HTML carregar) -->
    <script src="script.js" defer></script>
</body>
</html>
