<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo - João</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HEADER / INFORMAÇÕES PESSOAIS -->
        <header>
            <h1 id="fullName"></h1>
            <div class="professional-title" id="professionalTitle"></div>
            <div class="contact-info">
                <span id="email"></span>
                <span id="phone"></span>
                <span id="location"></span>
                <span>GitHub: <a id="github" href="#" target="_blank"></a></span>
            </div>
        </header>

        <!-- RESUMO PROFISSIONAL -->
        <section>
            <h2>Resumo Profissional</h2>
            <p id="summaryDescription"></p>
            <p><strong>Objetivo:</strong> <span id="careerObjective"></span></p>
        </section>

        <!-- EXPERIÊNCIA -->
        <section>
            <h2>Experiência Profissional</h2>
            <div id="experienceContainer"></div>
        </section>

        <!-- EDUCAÇÃO -->
        <section>
            <h2>Formação Acadêmica</h2>
            <div id="educationContainer"></div>
        </section>

        <!-- HABILIDADES -->
        <section>
            <h2>Habilidades e Tecnologias</h2>
            <p><strong>Técnicas / Ferramentas:</strong></p>
            <ul id="skillsContainer" class="tags-container"></ul>
            <p><strong>Metodologias:</strong> <span id="methodologies"></span></p>
        </section>

        <!-- PROJETOS -->
        <section>
            <h2>Projetos</h2>
            <div id="projectsContainer"></div>
        </section>

        <!-- IDIOMAS -->
        <section>
            <h2>Idiomas</h2>
            <p id="languagesContainer"></p>
        </section>
    </div>

    <!-- Importação do arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
